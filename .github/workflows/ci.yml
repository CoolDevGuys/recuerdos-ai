name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_IMAGE: recuerdos-ai-dev:ci

jobs:
  # fmt --check + clippy -D warnings + the boundary script, run inside the
  # same dev image contributors use locally (`just check`) so CI can never
  # drift from the documented dev flow.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: ${{ env.DEV_IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image

      # Registry and git checkouts only — deliberately not `target/`.
      # Restoring a build directory on top of a runner that also holds the
      # dev image and buildx cache is what exhausted the disk; it also
      # exceeded actions/cache's 10 GB per-entry limit, so it was costing
      # us upload time without ever being restorable.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo-registry
            .ci-cache/cargo-git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # `check-native` runs the test suite too, and those suites spawn real
      # daemons that load the embedding model at startup. Without this the
      # model is absent, every spawned daemon tries to download its own
      # copy at once, and they all blow the health-check timeout — a
      # failure that reads as "the tests are broken" rather than "the model
      # is missing". Locally the model is always mounted by
      # docker-compose, which is why this only ever bites in CI.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .ci-cache/models
          key: models-${{ runner.os }}-bge-small-en-v1.5

      - name: Warm the embedding model
        run: |
          mkdir -p .ci-cache/models
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -v "${{ github.workspace }}/.ci-cache/cargo-registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo-git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/.ci-cache/models:/models" \
            -e RECUERDOS_AI_EMBEDDINGS__CACHE_DIR=/models \
            -w /app \
            "${{ env.DEV_IMAGE }}" \
            cargo run -q --bin recuerdos-ai -- warm-models

      - name: cargo fmt --check / clippy -D warnings / boundary script
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -v "${{ github.workspace }}/.ci-cache/cargo-registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo-git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/.ci-cache/models:/models" \
            -e RECUERDOS_AI_EMBEDDINGS__CACHE_DIR=/models \
            -e RECUERDOS_AI_MODEL_CACHE=/models \
            -w /app \
            "${{ env.DEV_IMAGE }}" \
            just check-native

      # The container writes .ci-cache/ as uid 1000 ("dev"); actions/cache's
      # post-job tar runs as the runner's own uid and can't read those
      # files otherwise.
      - name: Fix cache ownership for actions/cache
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ci-cache

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: ${{ env.DEV_IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image

      # Registry and git checkouts only — deliberately not `target/`.
      # Restoring a build directory on top of a runner that also holds the
      # dev image and buildx cache is what exhausted the disk; it also
      # exceeded actions/cache's 10 GB per-entry limit, so it was costing
      # us upload time without ever being restorable.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo-registry
            .ci-cache/cargo-git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # The suites spawn real daemons, which load the embedding model at
      # startup. Downloading it once here (and caching it) keeps the tests
      # off the network and stops a HuggingFace hiccup failing the build.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .ci-cache/models
          key: models-${{ runner.os }}-bge-small-en-v1.5

      - name: Warm the embedding model
        run: |
          mkdir -p .ci-cache/models
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -v "${{ github.workspace }}/.ci-cache/cargo-registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo-git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/.ci-cache/models:/models" \
            -e RECUERDOS_AI_EMBEDDINGS__CACHE_DIR=/models \
            -w /app \
            "${{ env.DEV_IMAGE }}" \
            cargo run -q --bin recuerdos-ai -- warm-models

      - name: cargo test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -v "${{ github.workspace }}/.ci-cache/cargo-registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo-git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/.ci-cache/models:/models" \
            -e RECUERDOS_AI_EMBEDDINGS__CACHE_DIR=/models \
            -e RECUERDOS_AI_MODEL_CACHE=/models \
            -w /app \
            "${{ env.DEV_IMAGE }}" \
            just test-native

      - name: Fix cache ownership for actions/cache
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ci-cache

  # Retrieval quality, gated against a committed baseline.
  #
  # Its own job because it needs the real embedding model and takes tens of
  # seconds — folding it into `test` would slow down every run for a signal
  # that only matters when retrieval changes. It is the only check that can
  # catch a ranker regression: nothing in `test` would notice a one-line
  # change that quietly made freshness outrank relevance.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: ${{ env.DEV_IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image

      # Registry and git checkouts only — deliberately not `target/`.
      # Restoring a build directory on top of a runner that also holds the
      # dev image and buildx cache is what exhausted the disk; it also
      # exceeded actions/cache's 10 GB per-entry limit, so it was costing
      # us upload time without ever being restorable.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo-registry
            .ci-cache/cargo-git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .ci-cache/models
          key: models-${{ runner.os }}-bge-small-en-v1.5

      # Explicit rather than letting the eval download it on first use:
      # a HuggingFace hiccup should fail as "could not fetch the model",
      # not as a mysterious retrieval regression.
      - name: Warm the embedding model
        run: |
          mkdir -p .ci-cache/models
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -v "${{ github.workspace }}/.ci-cache/cargo-registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo-git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/.ci-cache/models:/models" \
            -e RECUERDOS_AI_EMBEDDINGS__CACHE_DIR=/models \
            -w /app \
            "${{ env.DEV_IMAGE }}" \
            cargo run -q --bin recuerdos-ai -- warm-models

      - name: Score retrieval against the baseline
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -v "${{ github.workspace }}/.ci-cache/cargo-registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo-git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/.ci-cache/models:/models" \
            -e RECUERDOS_AI_EMBEDDINGS__CACHE_DIR=/models \
            -w /app \
            "${{ env.DEV_IMAGE }}" \
            just eval-native

      - name: Fix cache ownership for actions/cache
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ci-cache

  # Lint, type-check and test the Python SDK, including its integration
  # suite against a daemon running the release image.
  #
  # Its own job because it needs no Rust toolchain at all — only Docker —
  # and because an SDK failure should read as "the client is wrong", not
  # as a server test failure.
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The integration suite runs against `docker/Dockerfile` — the same
      # artifact users get — so a client that works only against a dev
      # build cannot pass here.
      - name: Lint, type-check and test the SDK
        run: docker compose --profile sdk run --rm sdk

      - name: Daemon logs on failure
        if: failure()
        run: docker compose --profile sdk logs sdk-daemon 2>&1 | tail -50 || true

  # Build the release image and smoke-test it — proves docker/Dockerfile
  # actually produces a working, non-root, healthchecked daemon, not just
  # that it compiles.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: recuerdos-ai:ci
          load: true
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 7070:7070 recuerdos-ai:ci serve

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7070/healthz >/dev/null; then
              break
            fi
            sleep 0.5
          done

          echo "--- /healthz ---"
          curl -fsS http://127.0.0.1:7070/healthz
          echo
          echo "--- /version ---"
          curl -fsS http://127.0.0.1:7070/version
          echo

          # The endpoint responding doesn't mean Docker's own HEALTHCHECK
          # has run yet — it only probes after --start-period elapses.
          # Poll the reported status instead of checking once.
          status="starting"
          for _ in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' smoke)
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 1
          done
          echo "health status: $status"
          [ "$status" = "healthy" ]

          docker stop smoke
          docker rm smoke

      # Without this, a container that dies on startup shows up only as
      # "connection refused" — the actual reason (a linker error, in the
      # case that prompted adding this) stays in logs nobody printed.
      - name: Container logs on failure
        if: failure()
        run: docker logs smoke 2>&1 | tail -50 || true
