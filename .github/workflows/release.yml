name: Release

# Tag-driven. Pushing `v0.1.0` builds the binaries, publishes the image
# and drafts the release; nothing here runs on a branch push, so a merge
# to main can never publish by accident.
on:
  push:
    tags: ["v*"]
  # For rehearsing the build without creating a tag. Produces artifacts
  # and publishes nothing.
  workflow_dispatch:

permissions:
  contents: write   # create the release, upload assets
  packages: write   # push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # Each target builds on its own architecture rather than
  # cross-compiling. This project links three C/C++ dependencies —
  # bundled SQLite, ONNX Runtime behind fastembed, and tantivy's
  # compression — and setting up a working cross toolchain for all of
  # them is more fragile than paying for a second runner. A native build
  # also means the artifact is exercised on the platform it ships to.
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev

      - name: Build
        run: cargo build --release --locked --bin recuerdos-ai

      # Proves the artifact runs on the platform it was built for before
      # it is published. A binary that fails to start is the one failure
      # mode an install script cannot recover from, and `--version`
      # exercises the whole link — including the ONNX and SQLite objects.
      - name: Smoke test
        run: ./target/release/recuerdos-ai --version

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset="recuerdos-ai-${{ matrix.target }}.tar.gz"

          # Only the binary. The model is not baked in here — it is ~130
          # MB and would dominate the download; a bare-metal install
          # fetches it into ~/.recuerdos-ai/models on first use, and the
          # Docker image is the option for air-gapped hosts.
          tar -czf "$asset" -C target/release recuerdos-ai

          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

          # install.sh reads the first field of this file, so the format
          # has to stay `<hash>  <filename>`.
          cat "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  # Multi-arch image, built natively on one runner per architecture and
  # then stitched into a single manifest by the `image-manifest` job.
  #
  # The old approach emulated arm64 with QEMU on an amd64 runner, which for
  # this dependency tree (ONNX Runtime, SQLite and tantivy, all compiled
  # from source) turned a ~15-minute compile into a multi-hour one. A
  # native arm64 runner builds at the same speed as the amd64 one, and the
  # two run in parallel — so the image is as fast as its slower half.
  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase the image name
        # GHCR (OCI) requires a lowercase repository, but github.repository
        # keeps the org's original case (CoolDevGuys). Compute it once.
        run: echo "IMAGE_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.arch }}
          # On a tag: push this arch's image by digest (no tag yet — the
          # manifest job below applies the version tags across both). On a
          # rehearsal: `cacheonly` still compiles and links the whole thing
          # to prove it builds, but publishes nothing.
          outputs: ${{ startsWith(github.ref, 'refs/tags/') && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_LC) || 'type=cacheonly' }}

      - name: Export the digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-arch images pushed above into one multi-arch tag. This
  # is a metadata-only operation (seconds) — it references the digests, it
  # does not rebuild anything.
  image-manifest:
    name: Image manifest
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase the image name
        run: echo "IMAGE_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}
          # `latest` only for a final release. A prerelease tag that
          # quietly became `docker run …/recuerdos-ai` for everyone would
          # be a nasty surprise.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_LC }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:${{ steps.meta.outputs.version }}

  # Publishes the Python SDK (sdk/python) to PyPI via Trusted Publishing:
  # PyPI trusts this repo+workflow over OIDC, so there is no API token to
  # store or rotate. Final releases only — pyproject.toml carries a real
  # (non-prerelease) version, so a `-rc` tag must not push it as final.
  #
  # One-time setup on PyPI (see the repo's docs/deployment or CONTRIBUTING):
  # add a "pending publisher" for project `recuerdos-ai` with owner
  # `CoolDevGuys`, repository `recuerdos-ai`, workflow `release.yml`, and
  # environment `pypi`. Also create a GitHub Environment named `pypi`.
  pypi:
    name: Publish the Python SDK to PyPI
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC → PyPI Trusted Publishing; no stored secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          # Idempotent: a tag that did not bump the SDK version is a no-op
          # rather than a hard failure on "file already exists".
          skip-existing: true

  release:
    name: Draft the release
    needs: [binaries, image-manifest]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: What we are about to publish
        run: ls -la artifacts

      - name: Draft
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          generate_release_notes: true
          # Drafted, not published. The last step before a release is
          # visible to the world should be a person reading it — the
          # notes are generated, and generated notes are worth checking.
          draft: true
          prerelease: ${{ contains(github.ref, '-') }}
