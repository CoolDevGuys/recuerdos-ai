# RecordAgent configuration.
#
# Every key below shows its built-in default. Copy this file to
# `recordagent.toml` (or run `recordagent init`) and uncomment/change only
# what you need — anything you omit falls back to the default shown here.
# Every key can also be set via an env var: RECORDAGENT_<SECTION>__<KEY>,
# e.g. RECORDAGENT_SERVER__PORT=8080. Env vars win over this file.

[server]
host = "127.0.0.1"
port = 7070
# Which MCP transports to expose (Phase 3+).
mcp = { stdio = true, http = true }

[storage]
# embedded | postgres | qdrant (postgres/qdrant land post-POC, Phase 3+ roadmap)
backend = "embedded"
path = "~/.recordagent/data"

[embeddings]
# local | openai-compat | ollama — "local" needs no external service.
provider = "local"
# Pinned per collection; changing it requires the (future) `reindex` command.
model = "bge-small-en-v1.5"

[understanding]
# anthropic | openai-compat | ollama | none.
#
# "none" is the default and means zero LLM egress: submitted content is
# stored verbatim, with the category inferred from unambiguous phrasing
# ("I prefer", "we decided"). Everything still works — the same endpoints,
# the same jobs — but nothing is split into atomic memories and nothing is
# reconciled, so a contradiction is stored alongside what it contradicts.
#
# Set a provider and both of those start happening. No client changes.
provider = "none"
model = "claude-haiku-4-5"
# Name of the env var holding the provider API key (not the key itself).
# Not used by the ollama provider, which is unauthenticated.
api_key_env = "ANTHROPIC_API_KEY"
# Override the provider's address. Empty means its usual one. Set this for
# an OpenAI-compatible gateway (OpenRouter, Groq, a local vLLM) or an
# Ollama that isn't on localhost:11434.
base_url = ""
# Run the ADD/UPDATE/DELETE/NOOP reconcile pass against similar memories.
# With this off, extraction still labels and splits, but nothing is ever
# superseded or deleted by a model.
reconcile = true
# How many ingest jobs may run at once. Low enough that a burst of
# submissions cannot fan out into a rate limit or a surprise bill.
workers = 2
# Attempts before an ingest job is dead-lettered for a human to look at.
max_attempts = 3

[understanding.taxonomy]
# Extend the default category list (see docs/architecture.md) without
# replacing it.
extra_categories = []

[consolidation]
enabled = true
schedule = "daily"
similarity_threshold = 0.92

[retrieval]
hybrid = true
default_limit = 8
recency_half_life_days = 90

[auth]
# api-key | none. "none" is an explicit single-user opt-out: every request
# is treated as the built-in `default` user. Logged loudly at startup.
mode = "api-key"
