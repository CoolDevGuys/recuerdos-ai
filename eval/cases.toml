# Retrieval-quality eval set.
#
# The whole service is a bet that recall returns the right memory. Every
# other test in this repo asserts that a component behaves as written;
# this one asserts that the thing users actually care about still works.
# It runs against the real embedding model — a fake one would make the
# scores meaningless.
#
# TOML rather than the YAML the plan named: the mainstream YAML crate is
# deprecated, and this file needs comments and hand-editing more than it
# needs any particular syntax.
#
# Run it with:
#     recuerdos-ai eval
#     recuerdos-ai eval --baseline eval/baseline.json --max-drop 5
#
# Adding a case is the point. When a recall goes wrong in real use, the
# fix starts here: write the case, watch it fail, then change the ranker.

# ─────────────────────────────────────────────────────────────────────
# The corpus. Seeded once, then every query below runs against all of it.
#
# Size matters: with six memories nearly any ranker looks perfect. The
# filler entries exist so a case has something to be wrong about.
# ─────────────────────────────────────────────────────────────────────

