# Retrieval-quality eval set.
#
# The whole service is a bet that recall returns the right memory. Every
# other test in this repo asserts that a component behaves as written;
# this one asserts that the thing users actually care about still works.
# It runs against the real embedding model — a fake one would make the
# scores meaningless.
#
# TOML rather than the YAML the plan named: the mainstream YAML crate is
# deprecated, and this file needs comments and hand-editing more than it
# needs any particular syntax.
#
# Run it with:
#     recuerdos-ai eval
#     recuerdos-ai eval --baseline eval/baseline.json --max-drop 5
#
# Adding a case is the point. When a recall goes wrong in real use, the
# fix starts here: write the case, watch it fail, then change the ranker.

# ─────────────────────────────────────────────────────────────────────
# The corpus. Seeded once, then every query below runs against all of it.
#
# Size matters: with six memories nearly any ranker looks perfect. The
# filler entries exist so a case has something to be wrong about.
# ─────────────────────────────────────────────────────────────────────

# The four `preference.coding` memories that also demonstrate a sub-label
# (barrel files, pnpm, table-driven Go tests, Vitest) are defined once, in
# the subcategory section below — twice was V1 of recall-quality-plan.md:
# two rows of identical content are not two memories, they are two slots in
# every top-5 list the first one reaches. `validate()` refuses it now.

[[memory]]
content = "The backend deploys on Hetzner, migrated from Fly.io because of cost"
category = "fact.project"
tags = ["infrastructure"]
# The `current-fact` kind's target: it has to be the newest thing the corpus
# says about where the backend runs, or the recency multiplier decides that
# case before the ranker is asked anything (Task 0.2).
age_days = 12

[[memory]]
content = "The API is written in Rust with axum and tokio"
category = "fact.project"
tags = ["rust"]

[[memory]]
content = "SQLite was chosen over Postgres so the installer stays a single binary"
category = "decision"
tags = ["storage"]

[[memory]]
content = "The pgvector migration failed because the HNSW index exceeded maintenance_work_mem"
category = "experience"
tags = ["postgres", "migrations"]
# The older half of its pair with "Product search runs on the pgvector
# extension…" below: the near-miss case asks what search runs on *now*, and a
# hash cannot know that this incident is the superseded one (Task 0.2).
age_days = 320

