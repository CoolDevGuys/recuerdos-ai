# ─────────────────────────────────────────────────────────────────────
# Phase 7.1 corpus expansion (reranking-plan.md).
#
# Thirty-five memories cannot decide anything about a reranker: the fused
# head already contains the whole corpus, so a second stage has nowhere
# to gain and nowhere to lose (the Phase 6 rehearsal says exactly this).
# This section grows the store past one hundred memories with three kinds
# of pressure the reranker is proposed against:
#
#   * near-miss pairs — memories that read alike and answer different
#     questions, where the vector and keyword legs agree on the wrong
#     one and full cross-attention is supposed to separate them;
#   * abstract-category clusters — an "anything about X" query whose
#     answer is three memories sharing a theme and no vocabulary;
#   * realistic filler so the numbers are not trivially perfect.
#
# Filler rules learned the hard way in Phases 1–2: every entry stays
# concrete (a generic sentence is what a generic query like "how do I do
# it" drifts toward), and none of it shares vocabulary with the
# `negative` queries above — the negatives must keep passing at the
# floor as the corpus grows, or the Phase 7 ship gate reads corpus drift
# as a calibration break. Words like "best" (the Phase 2 noise word) are
# avoided outright.
# ─────────────────────────────────────────────────────────────────────

