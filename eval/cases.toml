tags = ["storage"]
entities = [
    { name = "billing service", kind = "service" },
    { name = "ledger-db", kind = "database" },
    { name = "Postgres", kind = "technology" },
]
relations = [
    { subject = "billing service", predicate = "stores_data_in", object = "ledger-db" },
]

