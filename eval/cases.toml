# ─────────────────────────────────────────────────────────────────────
# Relational corpus (Task 7.3.0).
#
# These memories exist to be *hopped*, not paraphrased. Each carries
# `entities` and `relations` — inert today (retrieval ignores them), the
# raw material the graph leg walks once Task 7.3.4 lands. They form small
# chains where the answer to a question lives in a memory that never names
# the question's subject: "who leads the billing team" is answerable only
# by walking billing service → Meridian team → Nadia.
#
# The `relational` cases below query these chains. Under today's
# semantic-only recall most should MISS, because the target shares no
# useful vocabulary with the query and no single memory holds the whole
# answer. That miss rate, recorded in the baseline, is the number that
# justifies (or cancels) the rest of Task 7.3 — see its go/no-go DoD.
# ─────────────────────────────────────────────────────────────────────

# Chain A — billing service / Meridian team / Nadia / Lisbon / ledger-db.
[[memory]]
content = "The billing service is maintained by the Meridian team"
category = "fact.project"
tags = ["ownership"]
entities = [
    { name = "billing service", kind = "service" },
    { name = "Meridian team", kind = "team" },
]
relations = [
    { subject = "billing service", predicate = "maintained_by", object = "Meridian team" },
]

[[memory]]
content = "Nadia is the tech lead of the Meridian team"
category = "fact.person"
tags = ["team"]
entities = [
    { name = "Nadia", kind = "person" },
    { name = "Meridian team", kind = "team" },
]
relations = [{ subject = "Nadia", predicate = "leads", object = "Meridian team" }]

[[memory]]
content = "The Meridian team works out of the Lisbon office"
category = "fact.project"
tags = ["team"]
entities = [
    { name = "Meridian team", kind = "team" },
    { name = "Lisbon office", kind = "location" },
]
relations = [
    { subject = "Meridian team", predicate = "located_in", object = "Lisbon office" },
]

[[memory]]
content = "The billing service stores its data in a Postgres database called ledger-db"
