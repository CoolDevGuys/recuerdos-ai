# ─────────────────────────────────────────────────────────────────────
# The cases.
#
# `expect` names memories by their exact content. `kind` groups results in
# the report, so a regression shows up as "paraphrase got worse" rather
# than as one number moving.
#
# Two more keys exist (reranking-plan.md Phase 0):
#
#   `expect_empty = true` — the correct answer is *nothing*: the query has
#   no answer in the corpus, and the case passes only when the recall
#   returns an empty list at the configured `[retrieval].min_relevance`
#   floor (the floor every agent-facing read applies). Such cases never
#   list `expect`; they are excluded from the overall recall/precision/MRR
#   means and scored by kind and by the run's abstention_rate instead.
#
#   `informational = true` — reported in every run but excluded from the
#   numbers a committed baseline gates against, so a case that documents
#   a known, deliberately-unfixed defect does not redden CI. The Phase 0
#   regression kinds carried it until Phases 1–2 fixed their defects; no
#   case is marked today (a test asserts that), but the mechanism stays
#   for the next deliberately-failing case someone needs to add.
# ─────────────────────────────────────────────────────────────────────

[[case]]
name = "paraphrase: package manager"
kind = "paraphrase"
# No shared content words with the memory beyond "package". This is the
# case keyword search alone cannot answer.
query = "which tool should I use to install dependencies"
expect = ["User prefers pnpm over npm and yarn for package management"]

[[case]]
name = "paraphrase: import structure"
kind = "paraphrase"
query = "how should I organise module exports in this repo"
expect = ["User forbids barrel files and index.ts re-exports"]

[[case]]
name = "paraphrase: why this database"
kind = "paraphrase"
query = "what was the reasoning behind the storage choice"
expect = ["SQLite was chosen over Postgres so the installer stays a single binary"]

[[case]]
name = "exact token: useQuery"
kind = "exact-token"
# An identifier the embedding model has no reason to place usefully.
# This is the case vector search alone cannot answer, and the reason
# retrieval is hybrid rather than purely semantic.
query = "useQuery"
expect = ["The useQuery hook wrapper lives in src/lib/query.ts and sets a 30s stale time"]

[[case]]
name = "exact token: maintenance_work_mem"
kind = "exact-token"
query = "maintenance_work_mem"
expect = [
    "The pgvector migration failed because the HNSW index exceeded maintenance_work_mem",
]

# Two more, added with the analyzer change (reranking-plan.md Phase 1.5):
# the stopword filter must not disturb identifiers — a dotted one and a
# hyphenated one, which split on the punctuation exactly as they did
# under tantivy's `default` tokenizer.
[[case]]
