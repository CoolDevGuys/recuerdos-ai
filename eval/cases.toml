# ─────────────────────────────────────────────────────────────────────
# Relational corpus (Task 7.3.0).
#
# These memories exist to be *hopped*, not paraphrased. Each carries
# `entities` and `relations` — inert today (retrieval ignores them), the
# raw material the graph leg walks once Task 7.3.4 lands. They form small
# chains where the answer to a question lives in a memory that never names
# the question's subject: "who leads the billing team" is answerable only
# by walking billing service → Meridian team → Nadia.
#
# The `relational` cases below query these chains. Under today's
# semantic-only recall most should MISS, because the target shares no
# useful vocabulary with the query and no single memory holds the whole
# answer. That miss rate, recorded in the baseline, is the number that
# justifies (or cancels) the rest of Task 7.3 — see its go/no-go DoD.
# ─────────────────────────────────────────────────────────────────────

