# ─────────────────────────────────────────────────────────────────────
# Phase 7.1 cases (reranking-plan.md).
#
# These measure what the second stage is for: heads where fusion puts a
# near-lookalike first. They are scored on this grown corpus, and the
# Phase 7 grid compares them off-vs-on, so a case whose gold moved with
# the expansion must be corrected *here*, not quietly in the baseline.
#
#   `near-miss` — the query has a distractor memory that shares its
#     shape ("waits N seconds", "reviews every pull request") and only
#     the right memory answers it.
#
#   `statement` — declarative situation phrasing ("I am about to X"),
#     the cross-encoder's blind spot by training (question→passage), so
#     its distribution is measured explicitly in task 7.4.
# ─────────────────────────────────────────────────────────────────────

[[case]]
name = "near-miss: slow upstream call"
kind = "near-miss"
# The two-seconds database memory shares the "fails after N seconds"
# shape; only the HTTP memory answers an upstream call.
query = "how long does a request wait when the upstream API is slow"
expect = ["The HTTP client gives up on an API request after ten seconds and retries twice"]

[[case]]
name = "near-miss: stale assets after deploy"
kind = "near-miss"
query = "why is the site still serving old static assets days after a deploy"
expect = ["Static assets are served from the CDN with a seven day cache header"]

[[case]]
name = "near-miss: charge stuck in the queue"
kind = "near-miss"
query = "what happens when a payment job fails processing"
expect = ["The payment worker requeues a failed job up to three times with exponential backoff"]

[[case]]
name = "near-miss: renewing the certificate"
kind = "near-miss"
query = "where do I renew the HTTPS certificate"
expect = ["The TLS certificate for the apex domain is renewed by the load balancer certificate manager"]

[[case]]
name = "near-miss: shared component review"
kind = "near-miss"
# Sam ("reviewer for anything touching authentication") is the distractor.
query = "who reviews a pull request that changes a shared button component"
expect = ["Ines owns the design system and reviews every pull request touching shared components"]

[[case]]
name = "near-miss: what search runs on"
kind = "near-miss"
# The failed pgvector migration memory is the distractor.
query = "what powers product search right now"
expect = ["Product search runs on the pgvector extension in Postgres since retiring Elasticsearch"]

[[case]]
name = "near-miss: cursor pagination why"
kind = "near-miss"
# The export-scoped decision is the distractor; the public-API rule answers.
query = "what is the rule about pagination in the public API"
expect = ["Public API pagination uses cursors, not offsets, past the first thousand rows"]

[[case]]
name = "statement: raw SQL in Go"
kind = "statement"
query = "I am pasting user input straight into a SQL query for Postgres from Go"
expect = ["Only parameterized queries are permitted for database operations"]

[[case]]
name = "statement: many exports in one file"
kind = "statement"
query = "my TypeScript module exports a dozen helper functions from one file"
expect = ["User requires one export per file in TypeScript projects"]

[[case]]
name = "statement: hand-run migration"
kind = "statement"
query = "a teammate is about to run a schema change directly on production"
expect = ["Migrations run inside the deploy job, never by hand against production"]

[[case]]
name = "statement: nervous about shipping"
kind = "statement"
query = "we are shipping a risky backend change we are not confident in"
expect = ["Feature flags wrap risky backend changes until they have survived a week of traffic"]

[[case]]
name = "nl-category: errors and logging"
kind = "nl-category"
query = "anything about errors and logging"
expect = [
    "The team wraps errors with anyhow context at the boundary and never swallows one",
    "Every 500 response logs a trace id linking to the OpenTelemetry span",
    "Alerts page only on sustained error rates and post to the platform channel otherwise",
]

[[case]]
name = "nl-category: public API rules"
kind = "nl-category"
query = "rules for our public HTTP API"
expect = [
    "Public API pagination uses cursors, not offsets, past the first thousand rows",
    "Breaking changes to a public endpoint require a new version segment under /v1",
    "Error payloads follow the RFC 9457 problem-details shape",
]

[[case]]
