[package]
name = "recuerdos-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Self-hostable long-term memory service for AI agents, over REST and MCP."
repository = "https://github.com/CoolDevGuys/recuerdos-ai"
publish = false

[[bin]]
name = "recuerdos-ai"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = "0.8"
# The `http` types (request::Parts, header names) the MCP HTTP transport
# reads out of a request context. Pinned to the same 1.x axum and rmcp use
# so the `Parts` type matches what rmcp stashes.
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.39", features = ["bundled"] }
refinery = { version = "0.9.2", default-features = false, features = ["rusqlite"] }
argon2 = "0.5.3"
rand = "0.10.2"
hex = "0.4.3"
sqlite-vec = "0.1.9"
tantivy = "0.25.0"
fastembed = "5.17.3"
sha2 = "0.11.0"
rmcp = { version = "2.2.0", features = ["server", "client", "transport-io", "transport-streamable-http-server", "macros", "schemars", "transport-streamable-http-client-reqwest"] }
async-trait = "0.1.91"
# `blocking` for the remote embedders: the `Embedder` trait is synchronous
# (the local ONNX path is CPU-bound), so an HTTP embedder needs a blocking
# client. reqwest's blocking client owns a Tokio runtime, though, and
# building/using/dropping it on one of the daemon's async threads panics
# ("Cannot drop a runtime in a context where blocking is not allowed") —
# which the startup probe, consolidation and `reindex` all do. So it is
# confined to a dedicated thread by embeddings::blocking_http.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# Used by the `eval` subcommand, which builds a throwaway instance so that
# scoring retrieval can never touch a real store.
tempfile = "3"

[dev-dependencies]
figment = { version = "0.10", features = ["test"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
assert_cmd = "2"
predicates = "3"
rmcp = { version = "2.2.0", features = ["client", "transport-child-process"] }
wiremock = "0.6"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

# Debug builds carry full DWARF by default, which for this dependency tree
# (tantivy, ONNX, rustls, axum) meant a ~10 GB `target/`. That is enough to
# exhaust a CI runner's disk, and when it does the failure is a linker
# `SIGBUS` — which reads as a toolchain problem rather than a full disk.
#
# Line tables keep file and line numbers in panic backtraces, which is what
# a test failure actually needs. Stepping through a debugger loses local
# variables; if you need that, override this locally.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
