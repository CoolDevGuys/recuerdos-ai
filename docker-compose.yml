services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/app/target
      - data:/data
      - models:/models
    ports:
      - "7070:7070"
    environment:
      RECORDAGENT_LOG: ${RECORDAGENT_LOG:-info}
      # Container-wide so the daemon (`docker compose up dev`) and the CLI
      # (`docker compose run --rm dev ...`) — separate containers — share
      # one database on the `data` volume. Without it each container would
      # write to its own throwaway home directory, and a key issued from
      # the CLI would be invisible to the running server.
      #
      # Safe for tests: the integration suites set this variable
      # explicitly per spawned app, and the config unit tests run inside
      # figment's Jail, which sandboxes the environment.
      RECORDAGENT_STORAGE__PATH: /data
      # A named volume, so the ~130 MB model is downloaded once and
      # shared by every dev container rather than landing in the
      # bind-mounted repo (fastembed's default is the working directory).
      RECORDAGENT_EMBEDDINGS__CACHE_DIR: /models
      # Same path the ignored real-model tests look for.
      RECORDAGENT_MODEL_CACHE: /models
    # RECORDAGENT_SERVER__HOST is scoped to this command (not a
    # container-wide `environment:` entry) so it doesn't leak into
    # `docker compose run --rm dev cargo test`. Containers must listen on
    # all interfaces to be reachable through Docker's published port;
    # recordagent.toml still defaults to 127.0.0.1 for bare-metal runs.
    command: ["sh", "-c", "RECORDAGENT_SERVER__HOST=0.0.0.0 cargo watch -x 'run -- serve'"]

  # The daemon the Python SDK's integration tests talk to. Runs the
  # release image — the same artifact users get — rather than a dev
  # build, so the tests also prove that image actually serves.
  #
  # `[auth].mode = "none"`: minting a key needs CLI access to the
  # daemon's own data dir, and wiring that into a test fixture would mean
  # either a privileged back door or a much more elaborate harness. What
  # a key changes on the wire is covered by the SDK's unit tests.
  sdk-daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["sdk"]
    environment:
      RECORDAGENT_AUTH__MODE: none
      RECORDAGENT_SERVER__HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7070/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  sdk:
    image: python:3.12-slim
    profiles: ["sdk"]
    depends_on:
      sdk-daemon:
        condition: service_healthy
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
    working_dir: /app/sdk/python
    environment:
      RECORDAGENT_TEST_URL: http://sdk-daemon:7070
      # The examples default to localhost, which inside this container is
      # not where the daemon is.
      RECORDAGENT_URL: http://sdk-daemon:7070
    command: >
      sh -c "pip install -q -e '.[dev,langchain]' &&
             ruff format --check src tests examples &&
             ruff check src tests examples &&
             mypy src &&
             pytest -q -m 'not integration' &&
             pytest -q -m integration &&
             echo '--- examples ---' &&
             python examples/quickstart.py &&
             python examples/langchain_retriever.py &&
             python -m py_compile examples/langgraph_memory.py"

  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pip-cache:
  cargo-registry:
  cargo-git:
  target:
  data:
  models:
  ollama-models:
