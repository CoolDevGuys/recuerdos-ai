# Recuerdos AI configuration.
#
# Every key below shows its built-in default. Copy this file to
# `recuerdos-ai.toml` (or run `recuerdos-ai init`) and uncomment/change only
# what you need — anything you omit falls back to the default shown here.
# Every key can also be set via an env var: RECUERDOS_AI_<SECTION>__<KEY>,
# e.g. RECUERDOS_AI_SERVER__PORT=8080. Env vars win over this file.

[server]
host = "127.0.0.1"
port = 7070
# MCP transports. `stdio` is the `recuerdos-ai mcp` shim (a per-client
# process). `http` mounts the streamable-HTTP MCP endpoint at `/mcp` on
# this daemon, so a client can connect over HTTP with a bearer token and
# no local binary — see docs/mcp.md. `stdio` here is informational; the
# shim is a separate command. Set `http = false` to not expose `/mcp`.
#
# `allowed_hosts` widens the `/mcp` DNS-rebinding guard, which by default
# accepts only loopback Host headers (localhost, 127.0.0.1, ::1) — correct
# when a reverse proxy fronts the daemon. To allow direct, proxy-less
# network access, list the hostname(s) clients connect with (added to the
# loopback defaults, so local access keeps working):
#   allowed_hosts = ["memory.example.com"]      # or "memory.example.com:7070"
# A single "*" disables the guard entirely (accept any Host) — only sensible
# on a trusted private network, and never a substitute for TLS + a key.
mcp = { stdio = true, http = true, allowed_hosts = [] }

[storage]
# embedded | postgres | qdrant (postgres/qdrant land post-POC, Phase 3+ roadmap)
backend = "embedded"
path = "~/.recuerdos-ai/data"

[embeddings]
# local | gemini | openai-compat | ollama.
#
# "local" is the default and needs no external service: embeddings are
# computed in-process on CPU, so the store works with no account, no key
# and no network. The others connect an external provider — see below.
#
# "gemini" is a native Google client, not the OpenAI-compat shim: it
# sends Gemini's taskType (RETRIEVAL_DOCUMENT when storing, RETRIEVAL_QUERY
# when searching), which its embedding models are trained for and which
# measurably improves recall. Use it over openai-compat for Gemini.
provider = "local"
# The embedding model. For "local" this is the ONNX model name
# (bge-small-en-v1.5). For a remote provider it is that provider's model
# id — e.g. "text-embedding-3-small" (openai-compat) or "nomic-embed-text"
# (ollama).
#
# Pinned per collection: the vector dimensions are fixed the first time a
# user stores something, so switching model on an existing store is a
# breaking change that requires the (future) `reindex` command. The
# daemon refuses to open a store whose pinned model no longer matches.
model = "bge-small-en-v1.5"
# Where the local ONNX model files live. Ignored by the remote providers.
cache_dir = "~/.recuerdos-ai/models"
# --- remote providers only (gemini, openai-compat, ollama) ---
# Override the provider's address. Empty means its usual one. Set this
# for an OpenAI-compatible gateway (OpenRouter, Together, a local vLLM,
# LM Studio) or an Ollama that isn't on localhost:11434. For gemini the
# default is Google's endpoint.
base_url = ""
# Name of the env var holding the provider's API key — never the key
# itself, which would end up committed. Required for gemini and for a
# hosted openai-compat provider; leave empty for a keyless local server.
# Ignored by ollama, which is unauthenticated.
#
# The model's dimensionality is discovered at startup by making one real
# embedding request, so a wrong URL, key or model name stops the daemon
# immediately rather than surfacing as empty recalls later.
api_key_env = ""

# Example — native Gemini embeddings (asymmetric, task-type-aware):
#   provider    = "gemini"
#   model       = "text-embedding-004"        # 768-dim
#   api_key_env = "GEMINI_API_KEY"            # a Google AI Studio key
#   # base_url defaults to Google's endpoint; leave it empty.

[understanding]
# anthropic | openai-compat | gemini | ollama | none.
#
# "none" is the default and means zero LLM egress: submitted content is
# stored verbatim, with the category inferred from unambiguous phrasing
# ("I prefer", "we decided"). Everything still works — the same endpoints,
# the same jobs — but nothing is split into atomic memories and nothing is
# reconciled, so a contradiction is stored alongside what it contradicts.
#
# Set a provider and both of those start happening. No client changes.
#
# "gemini" here is a preset over the openai-compat client pointed at
# Google's endpoint — Gemini speaks the chat-completions protocol, so
# reasoning needs no native client (unlike [embeddings], where "gemini" is
# a native client for taskType). Leave base_url empty and it defaults to
# Google's OpenAI-compatible endpoint.
provider = "none"
model = "claude-haiku-4-5"
# Name of the env var holding the provider API key (not the key itself).
# Not used by the ollama provider, which is unauthenticated.
api_key_env = "ANTHROPIC_API_KEY"
# Override the provider's address. Empty means its usual one. Set this for
# an OpenAI-compatible gateway (OpenRouter, Groq, a local vLLM) or an
# Ollama that isn't on localhost:11434. For "gemini" the default is
# Google's OpenAI-compatible endpoint.
base_url = ""

# Example — Gemini for reasoning (its own OpenAI-compatible endpoint):
#   provider    = "gemini"
#   model       = "gemini-2.0-flash"          # verify the id you can access
#   api_key_env = "GEMINI_API_KEY"            # a Google AI Studio key
#   # base_url defaults to Google's OpenAI-compatible endpoint; leave empty.
# Run the ADD/UPDATE/DELETE/NOOP reconcile pass against similar memories.
# With this off, extraction still labels and splits, but nothing is ever
# superseded or deleted by a model.
reconcile = true
# How many ingest jobs may run at once. Low enough that a burst of
# submissions cannot fan out into a rate limit or a surprise bill.
workers = 2
# Attempts before an ingest job is dead-lettered for a human to look at.
max_attempts = 3

[understanding.taxonomy]
# Extend the default category list (see docs/architecture.md) without
# replacing it.
extra_categories = []

[consolidation]
# The nightly tidy-up: near-duplicate memories are grouped, merged into
# the one memory that says what all of them said, and the originals
# superseded (retained, hidden from recall, in the audit trail).
#
# Needs an [understanding] provider — deciding whether two memories mean
# the same thing has no offline fallback. Without one this does nothing,
# and duplicates simply accumulate.
enabled = true
# hourly | daily | weekly. Measured from process start rather than being
# a wall-clock time: Recuerdos AI runs on laptops, and a laptop is asleep
# at 3am. The first run is one interval after startup, so a daemon that
# restarts often does not consolidate (and pay for it) every time.
schedule = "daily"
# How alike two memories must be to be considered the same thing, as
# cosine similarity of their embeddings. High on purpose: this is the
# only thing between a chain of loosely-related memories and a merge
# that loses a fact. Lower it and the model is asked about more pairs;
# it still gets the last word and is prompted to decline when unsure.
similarity_threshold = 0.92

[consolidation.budget]
# Maximum LLM merge calls per consolidation run. Set to 0 or omit for
# unlimited. When reached, the run stops early and reports
# budget_exhausted = true so the operator sees why.
max_llm_calls = 100
# Maximum wall-clock seconds per consolidation run. Set to 0 or omit for
# unlimited. Prevents a single run from monopolising the machine.
max_duration_secs = 300
# Maximum memories retired per consolidation run. Set to 0 or omit for
# unlimited. A safety valve against a misbehaving similarity threshold
# that would merge the whole corpus in one pass.
max_memories = 5000

[retrieval]
hybrid = true
default_limit = 8
recency_half_life_days = 90

[graph]
# The entity/relation graph (Strategy B). Off by default: the tables and
# hop traversal exist, but ingest writes no edges and recall does not hop
# until this is on. Enabling it is additive and never changes what plain
# semantic/keyword recall returns; it adds a third "connected to" leg on
# top. Still being rolled out (implementation-plan.md Task 7.3).
enabled = false
# How many edges one recall hop may traverse from its seeds. Two reaches
# "the person who leads the team that owns X".
max_hops = 2
# The most graph-found memories a hop contributes before fusion trims them
# against the vector and keyword legs.
hop_limit = 50

[auth]
# api-key | none. "none" is an explicit single-user opt-out: every request
# is treated as the built-in `default` user. Logged loudly at startup.
mode = "api-key"
